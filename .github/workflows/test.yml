# WT-4 test infrastructure CI: runs the full Go test suite against a local
# Postgres service container, plus vet and a production build.
#
# The tests never see a DATABASE_POOLER_URL here — only the local DATABASE_URL
# is set, which is exactly the environment tests/testutil expects.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: betrayal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d betrayal"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/betrayal?sslmode=disable
      MOCK_DATABASE: postgres://postgres:postgres@localhost:5432/betrayal?sslmode=disable
      ENVIRONMENT: local
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Install templ (pinned to go.mod version)
        run: go install github.com/a-h/templ/cmd/templ@v0.3.960

      - name: Install Tailwind CSS standalone CLI (v4, matches committed output.css)
        run: |
          curl -sL https://github.com/tailwindlabs/tailwindcss/releases/download/v4.1.2/tailwindcss-linux-x64 -o /tmp/tailwindcss
          chmod +x /tmp/tailwindcss
          sudo mv /tmp/tailwindcss /usr/local/bin/tailwindcss

      - name: Vet
        run: go vet ./...

      - name: Validate dependency and container hardening
        run: ./scripts/validate-dependency-container.sh

      - name: Check module tidy state
        run: go mod tidy -diff

      - name: Check vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Test (local Postgres)
        run: go test -race ./...

      - name: Test (uncached)
        run: go test -count=1 ./...

      - name: Build
        run: make build

      - name: Build container without secrets
        run: docker build -t betrayal:local-build-test .

      - name: Inspect container history for secret baking
        run: docker history --no-trunc betrayal:local-build-test
